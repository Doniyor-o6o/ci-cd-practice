name: Deploy app with Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: ./my-node-app
        run: |
          docker build -t registry.digitalocean.com/devops-course-registry/my-node-app:${{ github.sha }} .

      - name: Login to DigitalOcean Registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login registry.digitalocean.com -u doniyortolibov2006@gmail.com --password-stdin

      - name: Push Docker image
        run: |
          docker push registry.digitalocean.com/devops-course-registry/my-node-app:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Copy docker-compose file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "my-node-app/docker-compose-prod.yml"
          target: "/opt/my-node-app-on-docker/"
          strip_components: 2
        

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /opt/my-node-app-on-docker

            mv /opt/my-node-app-on-docker/docker-compose-prod.yaml \
            /opt/my-node-app-on-docker/docker-compose.yaml
            docker login docker login registry.digitalocean.com -u doniyortolibov2006@gmail.com --password-stdin
            yq -i '.services.web.image = "registry.digitalocean.com/devops-course-registry/my-node-app:${{ github.sha }}"' docker-compose.yaml

            docker login registry.digitalocean.com -u doniyortolibov2006@gmail.com -p "${{ secrets.REGISTRY_TOKEN }}"

            docker compose pull

            docker compose up -d --remove-orphans 